---


* name: Enterprise VM Monitoring
  hosts: all
  become: yes

  tasks:

  * name: CPU Usage
    shell: top -bn1 | grep "Cpu(s)"
    register: cpu

  * name: Memory Usage
    shell: free -h
    register: memory

  * name: Disk Usage
    shell: df -h
    register: disk

  * name: Uptime
    shell: uptime
    register: uptime

  * name: Running Services
    shell: systemctl list-units --type=service --state=running
    register: services

  * name: Report
    debug:
    msg:
    - "{{ inventory_hostname }}"
    - "{{ cpu.stdout }}"
    - "{{ memory.stdout }}"
    - "{{ disk.stdout }}"
    - "{{ uptime.stdout }}"

